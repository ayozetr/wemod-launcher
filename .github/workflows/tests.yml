name: Tests and lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tooling
        run: pip install pytest ruff black

      - name: Check formatting with black
        run: black --check -l 78 src/ tests/

      - name: Lint with ruff
        run: ruff check src/

      - name: Run tests
        run: pytest -q
